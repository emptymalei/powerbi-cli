[project]
name = "pbi_cli"
version = "0.4.0"
description = "Power BI Command Line Tool for managing Power BI projects."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "L M", email = "hi@leima.is"}
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.2,<3.0.0",
    "openpyxl>=3.1.4,<4.0.0",
    "loguru>=0.7.2,<0.8.0",
    "requests>=2.32.3,<3.0.0",
    "python-slugify>=8.0.4,<9.0.0",
    "keyring>=25.5.0,<26.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "cloudpathlib[s3]>=0.20.0,<0.21.0",
    "typer>=0.27.2,<0.28.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.4,<7.0.0",
    "pytest>=8.3.3,<9.0.0",
    "twine>=6.1.0,<7.0.0",
]
docs = [
    "zensical>=0.0.67,<0.1.0",
    "mkdocstrings-python>=2.0.9,<3.0.0",
]
tui = [
    "textual>=8.2,<9",
]

[project.scripts]
pbi = "pbi_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbi_cli"]
